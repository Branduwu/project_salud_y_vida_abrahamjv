name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgres://saludyvida:saludyvida_dev@localhost:5432/saludyvida_test
      TEST_DATABASE_URL: postgres://saludyvida:saludyvida_dev@localhost:5432/saludyvida_test
      AUTH_SECRET: ci-auth-secret-with-at-least-thirty-two-bytes
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: saludyvida_test
          POSTGRES_USER: saludyvida
          POSTGRES_PASSWORD: saludyvida_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U saludyvida -d saludyvida_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
